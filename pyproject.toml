[project]
name = "pumpguard"
version = "0.1.0"
description = "Retrospective anomaly detection for pump-and-dump signatures in Indian small/mid-cap stocks"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/db/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
  "B008",  # FastAPI Depends() in defaults is idiomatic
  "E501",  # line length is handled by `ruff format`
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["app/db/alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/alembic/*"]
